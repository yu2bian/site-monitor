name: site-monitor

on:
  schedule:
    # GitHub 对 */5 极高频 cron 常跳过，改错峰三条提高命中率（公开仓 Actions 免费无限）
    - cron: '*/10 * * * *'
    - cron: '3-59/10 * * * *'
    - cron: '7-59/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [probe]

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: run check
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: bash monitor.sh

      - name: save state
        run: |
          git config user.name "monitor-bot"
          git config user.email "yu2bian@users.noreply.github.com"
          git add state.txt
          git diff --cached --quiet || git commit -m "state: $(cat state.txt) [skip ci]"
          git push
